name: Pam Question Redundancy Validation

on:
  push:
    branches:
      - feature/pam-question-redundancy
    paths:
      - 'data/pam20q/**'
      - 'src/client/mom-mode/engine.js'
      - 'scripts/pam-classic-model.mjs'
      - 'scripts/pam-quality-model.mjs'
      - 'test/pam-*.test.mjs'
      - '.github/workflows/pam-question-redundancy.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Protect original 1,775-target source data against unintended edits
        run: git diff --exit-code 6ee006258414a8b65a23e2b9785b647a5e6ece3e HEAD -- data/pam20q/reference data/pam20q/extensions data/pam20q/quality/quality-375.json.gz.b64 data/pam20q/quality/quality-375.part1 data/pam20q/quality/quality-375.part2 data/pam20q/quality/quality-375.part3 data/pam20q/quality/quality-375.part4
      - name: Install dependencies
        run: npm ci
      - name: Run complete Pam regression suite
        run: node --test test/pam-classic20q.test.mjs test/pam-quality375.test.mjs test/pam-question-redundancy.test.mjs
      - name: Run production build
        run: npm run build
