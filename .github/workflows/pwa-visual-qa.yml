name: Temporary PWA visual QA

on:
  push:
    branches: [feature/pwa-native-felt-icons-and-controls]
    paths:
      - '.github/workflows/pwa-visual-qa.yml'
permissions:
  contents: write
jobs:
  capture-exact-felt-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/pwa-visual-qa.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/pwa-preview-*.png
          if ! git diff --cached --quiet; then
            git commit -m 'test(pwa): capture reference screenshots for design review'
            git push origin HEAD:feature/pwa-native-felt-icons-and-controls
          fi
