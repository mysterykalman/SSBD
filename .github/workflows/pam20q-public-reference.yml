name: Pam 20Q public reference evaluation

on:
  push:
    branches:
      - feature/pam-pretrained-20q-model
    paths:
      - 'scripts/pam20q/import_david_ar_20q.py'
      - 'scripts/pam20q/evaluate_public_reference.py'
      - 'scripts/pam20q/build_final_questions.py'
      - 'scripts/pam20q/write_reference_report.py'
      - 'scripts/pam20q/build.py'
      - 'scripts/pam20q/compile_2bit.py'
      - '.github/workflows/pam20q-public-reference.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pam20q-public-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check Pam20Q tools
        run: python3 -m py_compile scripts/pam20q/*.py

      - name: Build final question vocabulary
        run: python3 scripts/pam20q/build_final_questions.py

      - name: Import pinned david-ar reference
        run: python3 scripts/pam20q/import_david_ar_20q.py

      - name: Export existing Pam runtime evidence
        run: python3 scripts/pam20q/export-runtime-evidence.py

      - name: Evaluate public questions targets and encodings
        run: |
          python3 scripts/pam20q/evaluate_public_reference.py \
            --existing-evidence .dev-data/pam20q/existing-runtime-evidence.csv

      - name: Materialize build-time public question map
        run: |
          cp .dev-data/pam20q/public-reference-evaluation/question-comparison.csv \
            data/pam20q/reference/david-ar-20q/question-map.csv

      - name: Compile seeded model without AI
        run: |
          python3 scripts/pam20q/build.py \
            --skip-ai \
            --reset \
            --external .dev-data/pam20q/existing-runtime-evidence.csv
          python3 scripts/pam20q/compile_2bit.py

      - name: Verify AI was not used
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('.dev-data/pam20q/report.json').read_text())
          two=json.loads(Path('.dev-data/pam20q/compiled/pam20q.v1.2bit.report.json').read_text())
          assert report['cells_estimated_by_ai'] == 0, report
          assert report['ai_enrichment_ran'] is False, report
          assert report['canonical_question_count'] == 150, report
          assert report['public_20q_import']['targets'] == 1200, report
          assert two['concept_count'] == report['total_concepts'], two
          assert two['question_count'] == report['canonical_question_count'], two
          print(json.dumps({'uint8_gzip_bytes':report['compiled_artifact_size_bytes'],'two_bit_gzip_bytes':two['gzip_artifact_bytes']}, indent=2))
          PY

      - name: Persist evaluation outputs
        run: |
          mkdir -p docs/pam20q-public-reference
          cp .dev-data/pam20q/public-reference-evaluation/question-comparison.csv docs/pam20q-public-reference/
          cp .dev-data/pam20q/public-reference-evaluation/target-mapping.csv docs/pam20q-public-reference/
          cp .dev-data/pam20q/public-reference-evaluation/target-mapping.json docs/pam20q-public-reference/
          cp .dev-data/pam20q/public-reference-evaluation/disagreements.csv docs/pam20q-public-reference/
          cp .dev-data/pam20q/public-reference-evaluation/summary.json docs/pam20q-public-reference/
          cp .dev-data/pam20q/report.json docs/pam20q-public-reference/seeded-build-report.json
          cp .dev-data/pam20q/compiled/pam20q.v1.2bit.report.json docs/pam20q-public-reference/seeded-2bit-report.json
          python3 scripts/pam20q/write_reference_report.py

      - name: Commit deterministic reference artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/pam20q/final-canonical-questions.json \
            data/pam20q/reference/david-ar-20q \
            docs/pam20q-public-reference \
            docs/pam20q-public-reference-report.md
          if git diff --cached --quiet; then
            echo 'Reference artifacts already current.'
          else
            git commit -m 'Import and evaluate pinned classic 20Q reference [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
