name: Odd One In validation

on:
  pull_request:
    paths:
      - "src/shared/connections/**"
      - "src/client/connections/**"
      - "src/client/odd-one-in-*"
      - "test/connections-native.test.mjs"
      - ".github/workflows/odd-one-in-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/shared/connections/**"
      - "src/client/connections/**"
      - "src/client/odd-one-in-*"
      - "test/connections-native.test.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node --test test/connections-native.test.mjs
      - run: npm run typecheck
      - run: npx eslint src/shared/connections/generator.js src/shared/connections/library.js test/connections-native.test.mjs
