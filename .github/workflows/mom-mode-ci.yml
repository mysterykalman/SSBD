name: Mom Mode CI

on:
  push:
    branches:
      - integration/all-current-work
      - main
      - 'feature/pam-*'
  pull_request:
    branches:
      - integration/all-current-work
      - main

# Only the newest commit on the same branch needs the expensive full suite.
concurrency:
  group: mom-mode-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install PostgreSQL server binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # Unit tests inspect the generated dist/sw.js; build it from this exact SHA
      # instead of exercising a stale committed artefact.
      - name: Build generated test artefacts
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Race tests
        run: npm run test:race
      - name: Browser tests
        run: npm run test:e2e
      - name: Production build
        run: npm run build
