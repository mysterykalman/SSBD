name: Pam 500 expansion validation
on:
  push:
    branches:
      - feature/pam-500-deep-dive
    paths:
      - .github/workflows/pam-500-expansion.yml
      - data/pam20q/quality/**
      - scripts/generate-pam-500.mjs
      - scripts/audit-pam-500-separability.mjs
      - scripts/pam-quality-model.mjs
      - scripts/build-pam-classic.mjs
      - src/client/mom-mode/engine.js
      - test/pam-500-expansion-*.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pam-500-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    env:
      PAM_ALLOW_UNREVIEWED_500: '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild exactly 500 curated profiles
        run: node scripts/generate-pam-500.mjs
      - name: Audit candidate separability
        run: node scripts/audit-pam-500-separability.mjs
      - name: Publish the diagnostic dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pam-500-separability
          path: .dev-data/pam-500/separability-report.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Prove no original profile changed
        run: node --test test/pam-500-expansion-integrity.test.mjs
      - name: Simulate new targets and old baseline
        run: node --test --test-concurrency=1 test/pam-500-expansion-gameplay.test.mjs
      - name: Lint and type-check
        run: npm run lint && npm run typecheck
      - name: Run complete unit suite
        run: npm test
      - name: Compile production bundle
        run: npm run build
      - name: Verify Pam model shipped in production bundle
        run: |
          test -d dist/mom/assets
          MODEL_ASSET="$(find dist/mom/assets -maxdepth 1 -type f -name 'knowledge.generated.*.js' -print -quit)"
          test -n "$MODEL_ASSET"
          grep -q 'PAM_CLASSIC_MODEL' "$MODEL_ASSET"
          grep -q 'extensionTargets:1075' "$MODEL_ASSET"
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const dir='dist/mom/assets';
          const file=fs.readdirSync(dir).find(x=>/^knowledge\.generated\..*\.js$/.test(x));
          if(!file)throw new Error('Pam model bundle missing');
          const content=fs.readFileSync(path.join(dir,file),'utf8');
          const vm=require('vm'),sandbox={window:{}};
          vm.runInNewContext(content,sandbox,{timeout:10000});
          const model=sandbox.window.PAM_CLASSIC_MODEL;
          if(!model||model.targets.length!==2275||model.questions.length!==156||model.extensionTargets!==1075){
            throw new Error('Shipped bundle is not the integrated 2275-target Pam model');
          }
          console.log('PAM_SHIPPED_2275_MODEL=verified');
          NODE

  compile:
    env:
      PAM_ALLOW_UNREVIEWED_500: '1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate the candidate 2275-target model
        run: node scripts/generate-pam-500.mjs
      - name: Lint new Pam expansion sources
        run: npx eslint scripts/generate-pam-500.mjs scripts/audit-pam-500-separability.mjs scripts/pam-quality-model.mjs test/pam-500-expansion-gameplay.test.mjs test/pam-500-release-gate.test.mjs test/pam-500-expansion-integrity.test.mjs
      - name: Verify unchanged 1775 knowledge and 500 matrix append
        run: node --test test/pam-1775-integration.test.mjs test/pam-500-expansion-integrity.test.mjs test/pam-500-release-gate.test.mjs
      - name: Build complete production artifact without deployment
        run: npm run build
      - name: Check project-wide lint baseline (existing unrelated errors recorded)
        continue-on-error: true
        run: npm run lint
      - name: Check repository TypeScript baseline
        continue-on-error: true
        run: npm run typecheck
      - name: Prove shipped Pam payload contains 2275 targets
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),vm=require('node:vm');
          const dir='dist/mom/assets';
          const file=fs.readdirSync(dir).find(x=>/^knowledge\.generated\..*\.js$/.test(x));
          if(!file)throw Error('Missing production knowledge asset');
          const sandbox={window:{}};
          vm.runInNewContext(fs.readFileSync(path.join(dir,file),'utf8'),sandbox,{timeout:15000});
          const model=sandbox.window.PAM_CLASSIC_MODEL;
          if(!model||model.questions.length!==156||model.targets.length!==2275||model.extensionTargets!==1075){
            throw Error('Production bundle missing exact expanded model');
          }
          console.log('PAM_500_BUILD_VALIDATED=2275');
          NODE
