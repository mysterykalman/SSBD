name: Pam local development source snapshot
on:
  push:
    branches: [feature/pam-thematic-1650-knowledge-lab]
    paths: ['.github/workflows/pam-source-snapshot.yml']
permissions: {contents: read}
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Archive needed research and model source
        run: |
          mkdir -p /tmp/pam-snapshot
          tar -czf /tmp/pam-snapshot/SSBD-Pam-source.tar.gz scripts data/pam20q src/client/mom-mode test/pam-* docs/pam-thematic-knowledge-plan.md package.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pam-source-snapshot
          path: /tmp/pam-snapshot/SSBD-Pam-source.tar.gz
          retention-days: 7
