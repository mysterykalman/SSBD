name: Refresh Mom Mode knowledge

# IMPORTANT: this workflow is intentionally manual-only.
# The curated benchmark and 50k candidate inventory are frozen inputs. Knowledge
# generation must never rewrite the snapshot because of a push or a schedule.
# Run this workflow only when a deliberate knowledge refresh has been approved.
on:
  workflow_dispatch:
    inputs:
      people:
        description: "Notable people to request from Wikidata"
        required: false
        default: "4000"
      fictional:
        description: "Fictional characters to request from Wikidata"
        required: false
        default: "500"
      places:
        description: "Places and landmarks to request from Wikidata"
        required: false
        default: "700"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Refresh notable people, fiction, and places
        env:
          PEOPLE: ${{ inputs.people || '4000' }}
          FICTIONAL: ${{ inputs.fictional || '500' }}
          PLACES: ${{ inputs.places || '700' }}
        run: node scripts/refresh-mom-wikidata-v2.mjs --people="$PEOPLE" --fictional="$FICTIONAL" --places="$PLACES"
      - name: Refresh general-knowledge categories
        run: node scripts/refresh-mom-general-wikidata.mjs
      - name: Validate Mom Mode
        run: |
          node --test test/mom-general-knowledge.test.mjs
          npm test
          npm run build
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- src/client/mom-mode/knowledge.generated.js docs/mom-mode-knowledge-report.md; then
            echo "Knowledge snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/mom-mode/knowledge.generated.js docs/mom-mode-knowledge-report.md
          git commit -m "Refresh Mom Mode Wikidata knowledge"
          git push
