name: Refresh Mom Mode knowledge

on:
  workflow_dispatch:
    inputs:
      people:
        description: "Notable people to request from Wikidata"
        required: false
        default: "5000"
      fictional:
        description: "Fictional characters to request from Wikidata"
        required: false
        default: "1500"
      places:
        description: "Places and landmarks to request from Wikidata"
        required: false
        default: "2500"
  # Changing this workflow on the feature branch also bootstraps a real snapshot once.
  # The generated-data commit does not touch this file, so it cannot recurse.
  push:
    branches:
      - feature/mom-mode-stump-mom
    paths:
      - .github/workflows/mom-knowledge-refresh.yml
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build local Wikimedia knowledge snapshot
        env:
          PEOPLE: ${{ inputs.people || '5000' }}
          FICTIONAL: ${{ inputs.fictional || '1500' }}
          PLACES: ${{ inputs.places || '2500' }}
        run: npm run mom:knowledge -- --people="$PEOPLE" --fictional="$FICTIONAL" --places="$PLACES"
      - name: Validate Mom Mode
        run: |
          npm test
          npm run build
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- src/client/mom-mode/knowledge.generated.js docs/mom-mode-knowledge-report.md; then
            echo "Knowledge snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/mom-mode/knowledge.generated.js docs/mom-mode-knowledge-report.md
          git commit -m "Refresh Mom Mode Wikidata knowledge"
          git push
