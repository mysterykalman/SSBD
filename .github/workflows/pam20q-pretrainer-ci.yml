name: Pam 20Q pretrainer validation

on:
  push:
    branches:
      - feature/pam-pretrained-20q-model
    paths:
      - 'data/pam20q/**'
      - 'scripts/pam20q/**'
      - 'test/pam20q-pretrained-model.test.mjs'
      - '.github/workflows/pam20q-pretrainer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check Pam20Q build tools
        run: python3 -m py_compile scripts/pam20q/*.py

      - name: Build final canonical vocabulary
        run: python3 scripts/pam20q/build_final_questions.py

      - name: Validate canonical question invariants
        run: node --test test/pam20q-pretrained-model.test.mjs

      - name: Compile deterministic no-AI structural model
        run: python3 scripts/pam20q/build.py --skip-ai --no-public-reference --reset

      - name: Verify deterministic compilation
        shell: bash
        run: |
          set -euo pipefail
          first=$(shasum -a 256 .dev-data/pam20q/compiled/pam20q.v1.bin.gz | awk '{print $1}')
          python3 scripts/pam20q/build.py --skip-ai --no-public-reference
          second=$(shasum -a 256 .dev-data/pam20q/compiled/pam20q.v1.bin.gz | awk '{print $1}')
          test "$first" = "$second"

      - name: Verify structural report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('.dev-data/pam20q/report.json').read_text())
          assert report['total_concepts'] >= 50000, report
          assert report['canonical_question_count'] == 150, report
          assert report['total_concept_question_cells'] == report['total_concepts'] * 150, report
          assert report['compiled_raw_matrix_bytes'] == report['total_concept_question_cells'] + 16, report
          assert report['compiled_artifact_size_bytes'] > 0, report
          assert report['cells_estimated_by_ai'] == 0, report
          assert report['ai_enrichment_ran'] is False, report
          print(json.dumps(report, indent=2))
          PY
