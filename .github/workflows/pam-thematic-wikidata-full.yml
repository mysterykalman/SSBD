name: Pam 1650 Wikidata evidence discovery (research only)

# One research run, on this unmerged isolated branch. No production deploy or
# Git commits. Structured facts remain unreviewed and cannot enter gameplay.
on:
  push:
    branches: [feature/pam-thematic-1650-knowledge-lab]
    paths:
      - '.github/workflows/pam-thematic-wikidata-full.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  gather-unreviewed-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Test the identity and fact guards before using public data
        run: node --test test/pam-wikidata-reconcile.test.mjs test/pam-wikidata-facts.test.mjs
      - name: Collect name matches with throttled Wikimedia requests
        run: node scripts/pam-wikidata-reconcile.mjs --sample=1650 --pace-ms=1150
      - name: Collect provenance-tagged positive claim suggestions
        run: node scripts/pam-wikidata-facts.mjs
      - name: Save reviewable progress and research evidence, including partial runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pam-1650-unreviewed-wikidata-evidence
          path: |
            data/pam20q/expansion/wikidata-suggestion-sample.json
            data/pam20q/expansion/wikidata-facts-suggested.json
          if-no-files-found: warn
          retention-days: 30