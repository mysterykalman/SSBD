name: Pam production runtime rebuild

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pam-runtime-rebuild.yml
      - scripts/analyze-mom-trait-coverage.mjs
      - scripts/build-mom-50k-inventory.mjs
      - scripts/build-mom-playable-50k.mjs
      - scripts/build-mom-controlled-profiles.mjs
      - scripts/build-mom-runtime-knowledge.mjs
      - scripts/build-mom-static-wikidata.mjs
      - scripts/extract-wordnet-traits.py
      - scripts/extract-mom-extra-public-traits.py
      - scripts/extract-cskg-traits.py
      - scripts/mom-controlled-traits.mjs
      - scripts/mom-knowledge-repair.mjs
      - scripts/mom-playable-candidates.mjs
      - scripts/mom-runtime-compiler.mjs
      - scripts/mom-runtime-*.mjs
      - scripts/mom-safe-negatives.mjs
      - data/mom/wikidata/**
      - test/mom-cskg-extractor.test.mjs
      - test/mom-homonym-isolation.test.mjs
      - test/mom-knowledge-repair.test.mjs
      - test/mom-runtime-*.test.mjs

permissions:
  contents: write

concurrency:
  group: pam-production-runtime
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record production baseline audit
        run: |
          mkdir -p .dev-data/pam-rebuild
          node scripts/mom-knowledge-repair.mjs \
            --runtime src/client/mom-mode/knowledge.runtime.json \
            --json .dev-data/pam-rebuild/before-audit.json \
            --targets .dev-data/pam-rebuild/before-repair-targets.csv \
            --identity-targets .dev-data/pam-rebuild/before-identity-targets.csv \
            --limit 2000

      - name: Test repaired knowledge tooling
        run: |
          node --test \
            test/mom-cskg-extractor.test.mjs \
            test/mom-homonym-isolation.test.mjs \
            test/mom-knowledge-repair.test.mjs \
            test/mom-controlled-traits.test.mjs

      - name: Download 50k donor datasets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dev-data/mom-sources/allenai
          curl -L --fail --retry 3 -o .dev-data/mom-sources/things.csv https://raw.githubusercontent.com/evanthebouncy/20Q-selfplay/main/things.csv
          curl -L --fail --retry 3 -o .dev-data/mom-sources/brysbaert.txt https://raw.githubusercontent.com/ArtsEngine/concreteness/master/Concreteness_ratings_Brysbaert_et_al_BRM.txt
          curl -L --fail --retry 3 -o .dev-data/mom-sources/cel_2-45.txt https://raw.githubusercontent.com/BrianHutchison/Common-English-Lexicon/master/cel_2-45.txt
          curl -L --fail --retry 3 -o .dev-data/mom-sources/wordnik.txt https://raw.githubusercontent.com/wordnik/wordlist/main/wordlist-20210729.txt
          curl -L --fail --retry 3 -o .dev-data/mom-sources/allenai.tar.gz https://storage.googleapis.com/ai2-mosaic-public/projects/twentyquestions/v1.0/data/v1.0.twentyquestions.tar.gz
          tar -xzf .dev-data/mom-sources/allenai.tar.gz -C .dev-data/mom-sources/allenai

      - name: Rebuild playable 50k inventory
        env:
          MOM_ENRICH_LIMIT: "0"
        run: |
          node scripts/build-mom-50k-inventory.mjs
          node scripts/build-mom-playable-50k.mjs

      - name: Download public knowledge sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            .dev-data/trait-sources \
            .dev-data/trait-sources/visual-genome \
            .dev-data/trait-sources/paco \
            .dev-data/trait-sources/cskg
          git clone --depth 1 https://github.com/danoneata/seeing-what-tastes-good.git .dev-data/trait-sources/seeing-what-tastes-good
          git clone --depth 1 https://github.com/cardiffnlp/trait-concept-datasets.git .dev-data/trait-sources/trait-concept-datasets
          curl -L --fail --retry 3 --retry-delay 5 \
            -o .dev-data/trait-sources/conceptnet-assertions-5.7.0.csv.gz \
            https://s3.amazonaws.com/conceptnet/downloads/2019/edges/conceptnet-assertions-5.7.0.csv.gz
          CSKG_FILE=.dev-data/trait-sources/cskg/cskg.tsv.gz
          CSKG_URL='https://zenodo.org/records/4331372/files/cskg.tsv.gz?download=1'
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "CSKG download attempt ${attempt}/8"
            if wget --continue --tries=3 --timeout=90 --waitretry=5 \
              -O "$CSKG_FILE" "$CSKG_URL"; then
              if gzip -t "$CSKG_FILE"; then
                echo 'CSKG download complete and gzip integrity verified.'
                break
              fi
              echo 'CSKG gzip integrity check failed; restarting from scratch.' >&2
              rm -f "$CSKG_FILE"
            fi
            if [ "$attempt" -eq 8 ]; then
              echo 'CSKG download failed after resumable retries.' >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          curl -L --fail --retry 3 --retry-delay 5 \
            -o /tmp/vg-attributes.zip \
            https://homes.cs.washington.edu/~ranjay/visualgenome/data/dataset/attributes.json.zip
          unzip -q /tmp/vg-attributes.zip -d .dev-data/trait-sources/visual-genome
          curl -L --fail --retry 3 --retry-delay 5 \
            -o /tmp/vg-relationships.zip \
            https://homes.cs.washington.edu/~ranjay/visualgenome/data/dataset/relationships.json.zip
          unzip -q /tmp/vg-relationships.zip -d .dev-data/trait-sources/visual-genome
          curl -L --fail --retry 3 --retry-delay 5 \
            -o /tmp/paco-lvis.zip \
            https://dl.fbaipublicfiles.com/paco/annotations/paco_lvis_v1.zip
          unzip -q /tmp/paco-lvis.zip -d .dev-data/trait-sources/paco
          ls -lh \
            .dev-data/trait-sources/conceptnet-assertions-5.7.0.csv.gz \
            .dev-data/trait-sources/cskg/cskg.tsv.gz \
            /tmp/vg-attributes.zip \
            /tmp/vg-relationships.zip \
            /tmp/paco-lvis.zip

      - name: Build Open English WordNet evidence
        shell: bash
        run: |
          python -m pip install --quiet wn
          python scripts/extract-wordnet-traits.py

      - name: Build Visual Genome and PACO evidence
        run: python scripts/extract-mom-extra-public-traits.py

      - name: Add CSKG commonsense evidence
        run: python scripts/extract-cskg-traits.py

      - name: Build static Wikidata evidence
        run: |
          node scripts/build-mom-static-wikidata.mjs
          node - <<'NODE'
          const summary = require('./.dev-data/trait-sources/wikidata-static.summary.json');
          if (summary.networkRequests !== 0) throw new Error('Static Wikidata build unexpectedly used the network.');
          if (!summary.required || summary.concepts < 400 || summary.evidenceItems < 1500) {
            throw new Error('Required static Wikidata knowledge is missing or unexpectedly incomplete.');
          }
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Measure public trait coverage
        run: node scripts/analyze-mom-trait-coverage.mjs

      - name: Build controlled Pam profiles
        run: node scripts/build-mom-controlled-profiles.mjs

      - name: Build compact runtime intelligence
        run: node scripts/build-mom-runtime-knowledge.mjs

      - name: Audit regenerated runtime
        run: |
          node scripts/mom-knowledge-repair.mjs \
            --runtime .dev-data/mom-runtime/knowledge.runtime.json \
            --json .dev-data/pam-rebuild/after-audit.json \
            --targets .dev-data/pam-rebuild/after-repair-targets.csv \
            --identity-targets .dev-data/pam-rebuild/after-identity-targets.csv \
            --limit 2000
          node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('.dev-data/pam-rebuild/before-audit.json', 'utf8')).meta;
          const after = JSON.parse(fs.readFileSync('.dev-data/pam-rebuild/after-audit.json', 'utf8')).meta;
          const delta = {
            rawKnown: after.rawKnown - before.rawKnown,
            applicableKnown: after.applicableKnown - before.applicableKnown,
            applicableMissing: after.applicableMissing - before.applicableMissing,
            zeroKnowledgeConcepts: after.zeroKnowledgeConcepts - before.zeroKnowledgeConcepts,
            rootConflictConcepts: after.rootConflictConcepts - before.rootConflictConcepts,
            duplicateWordingGroups: after.duplicateWordingGroups - before.duplicateWordingGroups
          };
          fs.writeFileSync('.dev-data/pam-rebuild/audit-delta.json', JSON.stringify({before, after, delta}, null, 2) + '\n');
          console.log(JSON.stringify({before, after, delta}, null, 2));
          if (after.rootConflictConcepts > before.rootConflictConcepts) {
            throw new Error(`Root-category conflicts regressed: ${before.rootConflictConcepts} -> ${after.rootConflictConcepts}`);
          }
          if (after.zeroKnowledgeConcepts > before.zeroKnowledgeConcepts) {
            throw new Error(`Zero-knowledge concepts regressed: ${before.zeroKnowledgeConcepts} -> ${after.zeroKnowledgeConcepts}`);
          }
          NODE

      - name: Run runtime validation tests
        run: |
          node --test \
            test/mom-runtime-*.test.mjs \
            test/mom-question-metadata.test.mjs \
            test/mom-benchmark-suite.test.mjs

      - name: Run real 1,081-row gameplay benchmark
        env:
          MOM_RUNTIME_BENCHMARK_RUN: "1"
        run: node --test test/mom-runtime-benchmark.test.mjs

      - name: Print benchmark result
        run: |
          node - <<'NODE'
          const r = require('./.dev-data/mom-runtime-benchmark/report.json');
          console.log(JSON.stringify({
            rowCount:r.rowCount,
            presentCount:r.presentCount,
            pamWinCount:r.pamWinCount,
            pamWinRateOverall:r.pamWinRateOverall,
            pamWinRatePresent:r.pamWinRatePresent,
            pathFlagCount:r.pathFlagCount,
            questionQuality:r.questionQuality,
            failureClasses:r.failureClasses
          }, null, 2));
          NODE

      - name: Validate runtime shape
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const runtime = JSON.parse(fs.readFileSync('.dev-data/mom-runtime/knowledge.runtime.json', 'utf8'));
          if (runtime.meta.conceptCount < 50000) throw new Error(`Expected at least 50000 runtime concepts, got ${runtime.meta.conceptCount}`);
          if (runtime.meta.questionCount < 50) throw new Error(`Runtime question set is unexpectedly small: ${runtime.meta.questionCount}`);
          if (Object.keys(runtime.aliases || {}).length < runtime.meta.conceptCount) throw new Error('Runtime alias lookup is unexpectedly incomplete');
          console.log(JSON.stringify(runtime.meta, null, 2));
          NODE

      - name: Stage validated production runtime
        run: cp .dev-data/mom-runtime/knowledge.runtime.json src/client/mom-mode/knowledge.runtime.json

      - name: Upload rebuild evidence
        uses: actions/upload-artifact@v4
        with:
          name: pam-production-runtime-rebuild
          path: |
            .dev-data/pam-rebuild/
            .dev-data/mom-trait-coverage/
            .dev-data/mom-controlled-profiles/
            .dev-data/mom-runtime/
            .dev-data/mom-runtime-benchmark/
            .dev-data/trait-sources/extra-public-evidence.json
            .dev-data/trait-sources/wikidata-static.summary.json
            src/client/mom-mode/knowledge.runtime.json
          retention-days: 14

      - name: Commit validated runtime to production
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/mom-mode/knowledge.runtime.json
          if git diff --cached --quiet; then
            echo 'Production runtime is unchanged.'
          else
            git commit -m 'Pam: refresh production 50k runtime knowledge'
            git push origin HEAD:main
          fi
