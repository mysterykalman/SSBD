name: Pam 2000 candidate-source audit
on:
  push:
    branches: [feature/pam-500-from-2000]
    paths:
      - 'scripts/audit-pam-source-corpus.mjs'
      - '.github/workflows/pam-2000-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/audit-pam-source-corpus.mjs
