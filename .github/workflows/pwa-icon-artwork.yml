name: Build original felt launcher icons

on:
  push:
    branches: [feature/pwa-native-felt-icons-and-controls]
    paths:
      - 'scripts/rebuild-pwa-icons.py'
      - '.github/workflows/pwa-icon-artwork.yml'

permissions:
  contents: write

jobs:
  render-original-felt-icons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Preserve original launcher artwork and make transparent outputs
        run: |
          if [ ! -f src/client/icons/icon-source.png ]; then
            cp src/client/icons/icon-512.png src/client/icons/icon-source.png
          fi
          python scripts/rebuild-pwa-icons.py
      - name: Commit the generated branded assets to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/icons/
          if ! git diff --cached --quiet; then
            git commit -m 'art(pwa): remove white launcher backdrops from original felt icons'
            git push origin HEAD:feature/pwa-native-felt-icons-and-controls
          fi
