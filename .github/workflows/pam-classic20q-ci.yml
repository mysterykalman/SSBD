name: Pam Classic 20Q CI

on:
  push:
    branches:
      - feature/pam-classic20q
      - feature/homepage-4-mode-grid
      - 'feature/pam-*'
    paths:
      - 'data/pam20q/**'
      - 'src/client/mom-mode/**'
      - 'scripts/build-pam-classic.mjs'
      - 'scripts/pam-classic-model.mjs'
      - 'test/pam-classic20q.test.mjs'
      - 'test/pam-quality375.test.mjs'
      - 'test/e2e/mom-mode.test.mjs'
      - 'test/e2e/pam-opening.test.mjs'
      - 'test/pam-opening-six.test.mjs'
      - 'package.json'
  pull_request:
    paths:
      - 'data/pam20q/**'
      - 'src/client/mom-mode/**'
      - 'scripts/build-pam-classic.mjs'
      - 'scripts/pam-classic-model.mjs'
      - 'test/pam-classic20q.test.mjs'
      - 'test/pam-quality375.test.mjs'
      - 'test/e2e/mom-mode.test.mjs'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate integrated 1775-target Pam model
        run: node --test test/pam-classic20q.test.mjs test/pam-quality375.test.mjs test/pam-opening-six.test.mjs test/pam-1775-integration.test.mjs
      - name: Build offline game bundle
        run: npm run build
      - name: Verify classic assets are shipped
        run: |
          test -d dist/mom/assets
          MODEL_ASSET="$(find dist/mom/assets -maxdepth 1 -type f -name 'knowledge.generated.*.js' -print -quit)"
          ENGINE_ASSET="$(find dist/mom/assets -maxdepth 1 -type f -name 'engine.*.js' -print -quit)"
          test -n "$MODEL_ASSET"
          test -n "$ENGINE_ASSET"
          grep -q 'PAM_CLASSIC_MODEL' "$MODEL_ASSET"
          grep -q 'frozen-classic-20q' "$ENGINE_ASSET"
          if grep -R -n -i 'david-ar' dist/mom; then
            echo 'Source-specific identifier leaked into shipped Pam assets.'
            exit 1
          fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test Pam UI
        run: node --test --test-concurrency=1 test/e2e/mom-mode.test.mjs test/e2e/pam-opening.test.mjs
