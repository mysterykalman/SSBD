name: Installable PWA checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pwa-ci.yml'
      - 'src/client/**'
      - 'scripts/build.mjs'
      - 'scripts/build-pam-classic.mjs'
      - 'scripts/copy-audio-assets.mjs'
      - 'test/e2e/pwa-*.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pwa-ci.yml'
      - 'src/client/**'
      - 'scripts/build.mjs'
      - 'scripts/build-pam-classic.mjs'
      - 'scripts/copy-audio-assets.mjs'
      - 'test/e2e/pwa-*.test.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  standalone-and-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:pwa
