name: Inspect Vital source

on:
  push:
    branches:
      - feature/mom-mode-stump-mom
    paths:
      - .github/workflows/inspect-vital-source.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and inspect public Vital Articles CSV
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/vital.csv https://raw.githubusercontent.com/GeogSage/Wiki_Vital/main/Vitallist_AllLevels_15June2025_Full.csv
          ls -lh /tmp/vital.csv
          file /tmp/vital.csv || true
          python3 - <<'PY'
          from pathlib import Path
          import csv, io, collections
          data=Path('/tmp/vital.csv').read_bytes()
          print('first bytes', data[:40])
          text=data.decode('utf-8', errors='replace')
          reader=csv.DictReader(io.StringIO(text))
          rows=list(reader)
          print('HEADERS',reader.fieldnames)
          print('ROW COUNT',len(rows))
          print('UNIQUE ARTICLES',len({r.get('Article','').strip().casefold() for r in rows if r.get('Article','').strip()}))
          print('LEVEL COUNTS',collections.Counter(r.get('Vital_Level','') for r in rows))
          print('TOP CATEGORIES',collections.Counter(r.get('Vital_Category','') for r in rows).most_common(25))
          for r in rows[:8]:
              print('SAMPLE',r.get('Article'),r.get('Vital_Level'),r.get('Vital_Category'))
          PY
