name: Inspect Vital source

on:
  push:
    branches:
      - feature/mom-mode-stump-mom
    paths:
      - .github/workflows/inspect-vital-source.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and inspect public Vital Articles CSV
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/vital.csv https://raw.githubusercontent.com/GeogSage/Wiki_Vital/main/Vitallist_AllLevels_15June2025_Full.csv
          ls -lh /tmp/vital.csv
          file /tmp/vital.csv || true
          python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/vital.csv').read_bytes()
          print('first bytes', data[:20])
          for enc in ('utf-8-sig','utf-16','utf-16le','cp1252'):
              try:
                  text=data.decode(enc)
                  print('ENCODING',enc)
                  print(text[:3000])
                  print('LINE COUNT',len(text.splitlines()))
                  break
              except Exception as e:
                  print('decode failed',enc,type(e).__name__)
          PY
