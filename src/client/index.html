<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#fff4df">
<meta name="app-version" content="%APP_VERSION%">
<title>Same Same but Different</title>
<meta name="description" content="A ridiculous word game for people who think they know each other.">
<!-- Social/share previews (absolute URLs: share platforms fetch these from outside the app) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Same Same but Different">
<meta property="og:description" content="A ridiculous word game for people who think they know each other.">
<meta property="og:image" content="https://ssbd-omega.vercel.app/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Same Same but Different">
<meta name="twitter:description" content="A ridiculous word game for people who think they know each other.">
<meta name="twitter:image" content="https://ssbd-omega.vercel.app/icon-512.png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="%STYLES_CSS%">
<style>.btn{text-decoration:none}</style>
</head>
<body>
<a class="skip" href="#app">Skip to game</a>
<header class="topbar">
  <a class="brand" id="brandLink" href="/"><span class="brand-top" id="brandTop">Same Same</span><span class="brand-bottom" id="brandBottom">but different</span></a>
  <div class="top-actions">
    <span class="offline-pill" id="offlinePill" hidden></span>
    <!-- French stays wired in the app, but the switch is intentionally hidden during English-only public testing. -->
    <div class="lang-switch" id="langGroup" role="group" aria-label="Language" aria-hidden="true" style="display:none">
      <button type="button" data-lang="en" aria-pressed="true"><span aria-hidden="true">EN</span><span class="sr-only">English</span></button>
      <button type="button" data-lang="fr" aria-pressed="false"><span aria-hidden="true">FR</span><span class="sr-only" lang="fr">Français</span></button>
    </div>
    <button type="button" class="bell" id="notifBtn" aria-label="Notifications" hidden><svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0-6 6v3.2L4.3 15.6A1 1 0 0 0 5.2 17h13.6a1 1 0 0 0 .9-1.4L18 12.2V9a6 6 0 0 0-6-6Z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg><span class="bell-count" id="notifCount" hidden></span></button>
    <button type="button" class="avatar" id="profileBtn" aria-label="Settings">⚙</button>
  </div>
</header>
<main id="app" tabindex="-1"><p class="boot">Loading…</p></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="dialog" class="dialog"></dialog>
<noscript><p class="boot">This game needs JavaScript turned on.</p></noscript>
<script type="module" src="%APP_JS%"></script>
<script type="module" src="%AUDIO_JS%"></script>
<script src="/mom-launch.js" defer></script>
</body>
</html>
