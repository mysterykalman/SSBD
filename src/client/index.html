/* FEZ presentation v5. This layer composes the existing game DOM into a premium casual-game scene. */
html{background:#4d3164}
body{background:#f0c373!important}
.scene-backdrop{background:linear-gradient(180deg,#f7dba2 0 55%,#d68a52 55% 100%)!important;perspective:1000px}
.scene-backdrop::before{background:linear-gradient(90deg,rgba(255,247,220,.65),transparent 42%),linear-gradient(180deg,rgba(255,255,255,.35),transparent 45%,rgba(65,35,71,.14))!important}
.scene-backdrop::after{height:34vh!important;background:linear-gradient(180deg,transparent,rgba(76,42,67,.22))!important}
.scene-sun,.scene-cloud,.scene-hills,.scene-plant,.scene-shelf{display:none!important}
.scene-floor{left:-6vw!important;right:-6vw!important;bottom:-18vh!important;height:54vh!important;background:repeating-linear-gradient(90deg,rgba(84,43,53,.10) 0 2px,transparent 2px 82px),linear-gradient(180deg,#dca260,#b86f48)!important;transform:perspective(900px) rotateX(62deg)!important;box-shadow:inset 0 18px 35px rgba(82,45,57,.22)!important}
.fez-room-wall{position:absolute;inset:0 0 34vh;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent 40%),linear-gradient(#f7dca6,#efc77f);border-bottom:8px solid rgba(89,53,73,.22)}
.fez-room-window{position:absolute;left:6vw;top:10vh;width:min(24vw,320px);height:min(34vh,300px);border:14px solid #fff2d2;border-radius:28px;background:linear-gradient(180deg,#7ed9ec 0 62%,#78bd72 62%);box-shadow:0 9px 0 #5b3658,0 20px 45px rgba(49,30,60,.18),inset 0 0 0 6px #d99d61;overflow:hidden}
.fez-room-window::before,.fez-room-window::after{content:"";position:absolute;background:#fff0ce;box-shadow:0 3px 0 rgba(61,34,63,.18)}
.fez-room-window::before{left:50%;top:0;bottom:0;width:10px;transform:translateX(-50%)}
.fez-room-window::after{left:0;right:0;top:50%;height:10px;transform:translateY(-50%)}
.fez-room-shelf{position:absolute;right:5vw;top:15vh;width:min(18vw,245px);height:16px;border:4px solid #5a365b;border-radius:8px;background:#b66e46;box-shadow:0 7px 0 #75465a}
.fez-room-shelf::before{content:"";position:absolute;right:18px;bottom:12px;width:62px;height:86px;border:4px solid #5a365b;border-radius:10px 10px 4px 4px;background:linear-gradient(90deg,#41b8b0 0 28%,#f28f55 28% 54%,#f1cf58 54% 78%,#8a6bd9 78%);box-shadow:-88px 24px 0 -22px #6caf58,-88px 24px 0 -18px #5a365b}
.fez-room-rug{position:absolute;left:50%;bottom:3vh;width:min(76vw,980px);height:24vh;transform:translateX(-50%) perspective(800px) rotateX(62deg);border:7px solid #5b365a;border-radius:50%;background:radial-gradient(ellipse,#f7d56a 0 32%,#f07560 33% 48%,#42bbb5 49% 62%,#f5e6bd 63%);opacity:.8;box-shadow:0 26px 30px rgba(70,39,61,.2)}
.fez-room-cube{position:absolute;right:17vw;bottom:20vh;width:76px;height:76px;border:5px solid #4d3158;border-radius:16px;background:linear-gradient(145deg,#ff7a60,#e84c52);box-shadow:inset 0 5px 0 rgba(255,255,255,.35),0 10px 0 #4d3158,0 18px 30px rgba(67,39,62,.24);transform:rotate(8deg)}
.fez-room-cube::after{content:"?";display:grid;place-items:center;height:100%;font:1000 3.1rem/1 ui-rounded,"SF Pro Rounded",system-ui;color:#fff5dd;text-shadow:0 3px 0 #7a354c}
.topbar{min-height:150px!important;padding-top:22px!important;z-index:20}
.brand{padding-inline:38px!important}

main{position:relative!important;z-index:2;padding-bottom:120px!important}

body.fez-home-v5 .start-grid{grid-template-columns:1.08fr .92fr!important;grid-template-areas:"solo together" "solo mom"!important;gap:28px!important;align-items:stretch!important;filter:drop-shadow(0 20px 26px rgba(55,32,65,.12))}

body.fez-home-v5 .family-card{min-height:335px!important;grid-template-columns:185px 1fr!important;padding:24px 26px!important;background:linear-gradient(145deg,#48d7d0,#a4ece1)!important}

body.fez-home-v5 .mom-card-copy{padding:27px 27px 10px!important}
body.fez-home-v5 .mom-preview{background:#fff6df!important;border:3px solid #3b2753!important;box-shadow:0 3px 0 #3b2753!important}
body.fez-home-v5 .btn{border:4px solid #3b2753!important;border-radius:18px!important;box-shadow:inset 0 4px 0 rgba(255,255,255,.43),inset 0 -5px 0 rgba(76,31,54,.14),0 6px 0 #3b2753,0 13px 20px rgba(55,31,64,.18)!important;min-height:58px!important;text-transform:none!important}

/* Character picker becomes a full game selection stage, not a generic dialog. */
.character-picker{width:min(1040px,calc(100vw - 34px))!important;max-width:none!important;border:0!important;border-radius:36px!important;padding:0!important;background:transparent!important;overflow:visible!important;box-shadow:none!important}

.character-picker .pick-copy{display:block!important;padding:0 24px!important;text-align:center!important;color:#594963!important;font-weight:780!important;line-height:1.38!important}
.character-picker .pick-line{display:block!important}
.character-picker .pick-radio{position:absolute!important;right:18px!important;top:18px!important;width:30px!important;height:30px!important;z-index:6!important;accent-color:#ff665f!important}

.character-picker .dialog-close{z-index:8!important;right:18px!important;top:18px!important;border:3px solid #3b2753!important;background:#fff6dd!important;box-shadow:0 4px 0 #3b2753!important}

  .character-picker .pick-body{padding:42px 24px 30px!important}.character-picker .pick-cards{gap:18px!important}.character-picker .pick-card{min-height:390px!important}.character-picker .pick-art{height:240px!important}
}

  main{padding:0 14px 80px!important}body.fez-home-v5 .hero{padding:24px 20px 20px!important;border-radius:22px!important}body.fez-home-v5 .hero h1{font-size:1.85rem!important}
  body.fez-home-v5 .start-grid{gap:20px!important}.start-grid>.start,.start-grid>.mom-card{border-radius:26px!important}

  .character-picker{width:calc(100vw - 18px)!important}.character-picker .pick-body{padding:38px 14px 22px!important;border-radius:25px!important}.character-picker #pickTitle{margin-bottom:30px!important;font-size:1.45rem!important}.character-picker .pick-cards{grid-template-columns:1fr 1fr!important;gap:10px!important}.character-picker .pick-card{min-height:330px!important;border-radius:20px!important}.character-picker .pick-art{height:190px!important}.character-picker .pick-name{font-size:1.25rem!important;padding:7px 12px!important}.character-picker .pick-copy{padding:0 10px!important;font-size:.78rem!important}.character-picker .row.end{margin-top:24px!important;gap:10px!important}.character-picker .row.end .btn{min-width:0!important;flex:1!important}

<body>

  <div class="fez-room-wall"></div>

  <div class="scene-plant plant-b"></div>

</div>
<header class="topbar">
  <a class="brand" id="brandLink" href="/">
    <span class="brand-cube brand-cube-a" aria-hidden="true"></span>
    <span class="brand-top" id="brandTop">Same Same</span>

    <span class="brand-cube brand-cube-b" aria-hidden="true"></span>
  </a>
  <div class="top-actions">
    <span class="offline-pill" id="offlinePill" hidden></span>
    <div class="lang-switch" id="langGroup" role="group" aria-label="Language" aria-hidden="true" style="display:none">
      <button type="button" data-lang="en" aria-pressed="true"><span aria-hidden="true">EN</span><span class="sr-only">English</span></button>
      <button type="button" data-lang="fr" aria-pressed="false"><span class="sr-only" lang="fr">Français</span></button>
    </div>
    <button type="button" class="bell" id="notifBtn" aria-label="Notifications" hidden><svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0-6 6v3.2L4.3 15.6A1 1 0 0 0 5.2 17h13.6a1 1 0 0 0 .9-1.4L18 12.2V9a6 6 0 0 0-6-6Z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg><span class="bell-count" id="notifCount" hidden></span></button>

<script>
(() => {
  const app = document.getElementById('app');
  const labels = new WeakSet();
  const enhance = () => {
    const grid = app?.querySelector('.start-grid');
    document.body.classList.toggle('fez-home-v5', Boolean(grid));
    if (grid) {
      for (const card of grid.children) {
        if (labels.has(card)) continue;
        labels.add(card);
        const title = card.querySelector('h2')?.textContent?.replace(/\s+/g,' ').trim() || 'Play';
        const flag = document.createElement('span');
        flag.className = 'fez-mode-flag';
        flag.setAttribute('aria-hidden','true');
        flag.textContent = title.replace(/beta/ig,'').trim();
        const dots = document.createElement('span');
        dots.className = 'fez-card-dots';
        dots.setAttribute('aria-hidden','true');
        dots.innerHTML = '<i></i><i></i><i></i>';
        card.prepend(dots);
        card.prepend(flag);
      }
    }
    const picker = document.getElementById('characterPicker');
    document.body.classList.toggle('fez-picker-open', Boolean(picker?.open));
  };
  const observer = new MutationObserver(() => requestAnimationFrame(enhance));
  if (app) observer.observe(app,{childList:true,subtree:true});
  observer.observe(document.body,{childList:true,subtree:false});
  document.addEventListener('change',enhance,true);
  document.addEventListener('click',() => requestAnimationFrame(enhance),true);
  enhance();
})();
</script>
</body>
</html>
